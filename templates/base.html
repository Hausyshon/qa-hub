<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>问答社区</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
		<a class="navbar-brand" href="{% url 'core:index' %}">Q&A Hub</a>
		<div class="ms-auto">
			{% if user.is_authenticated %}
				<span>你好，{{user.username}}</span>
				<form method="post" action="{% url 'users:logout' %}" class="d-inline">
    				{% csrf_token %}
    				<button type="submit" class="btn btn-outline-danger btn-sm">登出</button>
				</form>
			{% else %}
			<a href="{% url 'users:login' %}" class="btn btn-outline-primary btn-sm">登录</a>
			<a href="{% url 'users:register' %}" class="btn btn-primary btn-sm">注册</a>
			{% endif %}
		</div>		
	</nav>
	<div class="container mt-4">
		{% block content %}{% endblock %}
	</div>
</body>
</html>
